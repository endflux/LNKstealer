  - name: Debug - list build outputs
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "===== Current directory ====="
          Get-Location

          Write-Host "`n===== GITHUB_WORKSPACE ====="
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host "`n===== Top-level contents ====="
          Get-ChildItem -Force | Format-Table Mode, LastWriteTime, Length, Name -AutoSize

          Write-Host "`n===== All .exe files ====="
          Get-ChildItem -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "`n===== All .dll files ====="
          Get-ChildItem -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "`n===== All .enc files ====="
          Get-ChildItem -Recurse -Filter *.enc -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "`n===== Anything in build/ (if it exists) ====="
          if (Test-Path build) {
            Get-ChildItem -Path build -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "No 'build' directory at workspace root."
          }
        continue-on-error: true
